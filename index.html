<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Ironworks — Convict Conditioning Tracker</title>
    <meta name="description" content="Ironworks — a Convict Conditioning workout tracker for the Good Behavior 3-day program." />

    <!-- Standard favicons -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />

    <style>
